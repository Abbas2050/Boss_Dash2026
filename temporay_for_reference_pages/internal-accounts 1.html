<!DOCTYPE html>
<html>
<head>
    <title>SLC - Internal Accounts</title>
    <style>
body { padding: 0; }
.page { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
        h1 { color: var(--blue); margin-bottom: 6px; }
        .subtitle { color: var(--fg-muted); font-size: 13px; margin-bottom: 8px; }

        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
        h2 { color: var(--pos); margin-bottom: 8px; }

        .form-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .form-row input, .form-row select { background: var(--bg3); border: 1px solid #414868; color: var(--fg); padding: 4px 8px; border-radius: 4px; font-size: 13px; }
        .form-row input[type="number"] { width: 130px; }
        .form-row input[type="text"] { width: 150px; }
        .form-row select { min-width: 100px; }

        .checkbox-group { display: flex; gap: 14px; align-items: center; font-size: 13px; }
        .checkbox-group label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: #888; }
        .checkbox-group input[type="checkbox"] { accent-color: var(--blue); }

        button { background: var(--blue); color: var(--surface); border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; }
        button:hover { background: #89b4fa; }
        button.danger { background: var(--rose); padding: 4px 10px; font-size: 12px; }
        button.danger:hover { background: #ff9e9e; }
        button.save { background: var(--pos); padding: 4px 10px; font-size: 12px; }
        button.save:hover { background: #b5e88a; }

        #msg { margin-top: 10px; font-size: 13px; min-height: 20px; }
        .msg-ok { color: var(--pos); }
        .msg-err { color: var(--rose); }

        .count { font-size: 12px; color: var(--fg-muted); margin-bottom: 10px; }

        .badge { font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 3px; }
        .badge-live { background: rgba(122, 162, 247, 0.15); color: var(--blue); }
        .badge-bonus { background: rgba(224, 175, 104, 0.15); color: var(--amber); }
        .badge-on { background: rgba(158, 206, 106, 0.15); color: var(--pos); }
        .badge-off { background: rgba(86, 95, 137, 0.15); color: var(--fg-muted); }
        .badge-inactive { background: rgba(247, 118, 142, 0.15); color: var(--rose); }

        #dataGrid { height: 500px; width: 100%; }
        #dataGrid .ag-cell { display: flex; align-items: center; }
        #dataGrid .actions { display: flex; gap: 5px; align-items: center; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 20px; width: 420px; }
        .modal h2 { font-size: 15px; color: var(--blue); margin-bottom: 16px; }
        .modal .field { margin-bottom: 12px; }
        .modal .field label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
        .modal .field input, .modal .field select { width: 100%; background: var(--bg3); border: 1px solid #414868; color: var(--fg); padding: 4px 8px; border-radius: 4px; font-size: 13px; }
        .modal .field .checkbox-row { display: flex; gap: 16px; align-items: center; font-size: 13px; }
        .modal .field .checkbox-row label { display: flex; align-items: center; gap: 4px; cursor: pointer; color: var(--fg); margin-bottom: 0; }
        .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        .modal .actions button.cancel { background: var(--fg-muted); }
        .auto-detected { font-size: 11px; color: var(--amber); margin-top: 4px; }
    </style>
    <link rel="stylesheet" href="/shared/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
    <script src="/shared/grid.js"></script>
    <script src="/shared/nav.js"></script>
</head>
<body>
<div class="page">
        <h1>Internal Accounts</h1>
        <div class="subtitle">Configure accounts to exclude from equity and/or coverage calculations</div>

        <div class="panel">
            <h2>Add Internal Account</h2>
            <div class="form-row">
                <input id="loginInput" type="number" placeholder="MT5 Login" min="1" />
                <input id="labelInput" type="text" placeholder="Label" />
                <select id="systemSelect">
                    <option value="Live">Live</option>
                    <option value="Bonus">Bonus</option>
                </select>
                <input id="descInput" type="text" placeholder="Description (optional)" style="width:200px" />
            </div>
            <div class="checkbox-group" style="margin-top:10px;">
                <label><input type="checkbox" id="exclEquity" /> Include in Equity</label>
                <label><input type="checkbox" id="exclPositions" /> Include in Positions</label>
                <label><input type="checkbox" id="exclProfiling" /> Include in Client Profiling</label>
                <label><input type="checkbox" id="exclDealMatching" /> Include in Deal Matching</label>
                <label><input type="checkbox" id="exclSwaps" checked /> Include in Swaps</label>
                <button onclick="addAccount()" style="margin-left:auto">Add</button>
            </div>
            <div id="msg"></div>
        </div>

        <div class="panel">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
                <h2 style="margin-bottom:0">Internal Accounts</h2>
                <button onclick="resolveSystems()" style="font-size:12px;padding:5px 12px;">Auto-Detect Systems</button>
            </div>
            <div id="count" class="count"></div>

            <!-- Bulk-action toolbar: visible only when one or more rows are selected. -->
            <div id="bulkBar" style="display:none; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 10px; margin-bottom:8px; border:1px solid var(--border); border-radius:6px; background:rgba(255,255,255,0.03);">
                <span id="bulkCount" style="font-size:12px; color:var(--neon); font-weight:600;">0 selected</span>
                <span style="font-size:12px; color:var(--fg-dim);">Apply to:</span>
                <label style="font-size:12px;"><input type="checkbox" id="bulkSurfEquity"> Equity</label>
                <label style="font-size:12px;"><input type="checkbox" id="bulkSurfPositions"> Positions</label>
                <label style="font-size:12px;"><input type="checkbox" id="bulkSurfProfiling"> Profiling</label>
                <label style="font-size:12px;"><input type="checkbox" id="bulkSurfDealMatching"> Deal Matching</label>
                <label style="font-size:12px;"><input type="checkbox" id="bulkSurfSwaps"> Swaps</label>
                <button onclick="bulkApply(true)" class="save" style="font-size:12px; padding:5px 10px;" title="Set the selected surfaces to Excluded on every selected row">Mark Excluded</button>
                <button onclick="bulkApply(false)" style="font-size:12px; padding:5px 10px;" title="Set the selected surfaces to Included on every selected row">Mark Included</button>
                <span style="border-left:1px solid var(--border); height:18px; margin:0 6px;"></span>
                <button onclick="bulkSetActive(true)" style="font-size:12px; padding:5px 10px;">Activate</button>
                <button onclick="bulkSetActive(false)" class="danger" style="font-size:12px; padding:5px 10px;">Deactivate</button>
            </div>

            <div id="dataGrid" class="ag-theme-alpine-dark"></div>
        </div>
    </div>

    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h2>Edit Internal Account</h2>
            <input type="hidden" id="editId" />
            <div class="field">
                <label>MT5 Login</label>
                <input id="editLogin" type="number" />
            </div>
            <div class="field">
                <label>Label</label>
                <input id="editLabel" type="text" />
            </div>
            <div class="field">
                <label>System</label>
                <select id="editSystem">
                    <option value="Live">Live</option>
                    <option value="Bonus">Bonus</option>
                </select>
                <div class="auto-detected" id="editSystemNote">System is auto-detected from MT5 on save</div>
            </div>
            <div class="field">
                <label>Description</label>
                <input id="editDesc" type="text" />
            </div>
            <div class="field">
                <label>Exclusions</label>
                <div class="checkbox-row">
                    <label><input type="checkbox" id="editExclEquity" /> Include in Equity</label>
                    <label><input type="checkbox" id="editExclPositions" /> Include in Positions</label>
                    <label><input type="checkbox" id="editExclProfiling" /> Include in Client Profiling</label>
                    <label><input type="checkbox" id="editExclDealMatching" /> Include in Deal Matching</label>
                    <label><input type="checkbox" id="editExclSwaps" /> Include in Swaps</label>
                </div>
            </div>
            <div class="actions">
                <button class="cancel" onclick="closeEditModal()">Cancel</button>
                <button onclick="saveEdit()">Save</button>
            </div>
        </div>
    </div>

<script>
    const API = '/api/internal-accounts';
    let grid = null;

    const columnDefs = [
        { headerName: '', checkboxSelection: true, headerCheckboxSelection: true, width: 38, minWidth: 38, maxWidth: 38, pinned: 'left', filter: false, sortable: false, resizable: false, suppressMenu: true },
        { headerName: 'Login', field: 'mt5Login', cellStyle: { color: 'var(--pos)', fontWeight: 600 } },
        { headerName: 'Label', field: 'label', cellStyle: { fontWeight: 600 } },
        {
            headerName: 'System', field: 'system', maxWidth: 100,
            cellRenderer: p => p.value === 'Bonus'
                ? '<span class="badge badge-bonus">Bonus</span>'
                : '<span class="badge badge-live">Live</span>'
        },
        {
            headerName: 'Equity', field: 'excludeFromEquity', maxWidth: 110,
            cellRenderer: p => p.value
                ? '<span class="badge badge-on">Excluded</span>'
                : '<span class="badge badge-off">Included</span>'
        },
        {
            headerName: 'Positions', field: 'excludeFromPositions', maxWidth: 110,
            cellRenderer: p => p.value
                ? '<span class="badge badge-on">Excluded</span>'
                : '<span class="badge badge-off">Included</span>'
        },
        {
            headerName: 'Profiling', field: 'excludeFromClientProfiling', maxWidth: 110,
            cellRenderer: p => p.value
                ? '<span class="badge badge-on">Excluded</span>'
                : '<span class="badge badge-off">Included</span>'
        },
        {
            headerName: 'Deal Matching', field: 'excludeFromDealMatching', maxWidth: 130,
            cellRenderer: p => p.value
                ? '<span class="badge badge-on">Excluded</span>'
                : '<span class="badge badge-off">Included</span>'
        },
        {
            headerName: 'Swaps', field: 'excludeFromSwaps', maxWidth: 110,
            cellRenderer: p => p.value
                ? '<span class="badge badge-on">Excluded</span>'
                : '<span class="badge badge-off">Included</span>'
        },
        { headerName: 'Description', field: 'description', cellStyle: { color: '#565f89', fontSize: '12px' }, valueFormatter: p => p.value || '-' },
        {
            headerName: 'Status', field: 'isActive', maxWidth: 100,
            cellRenderer: p => p.value
                ? '<span class="badge badge-on">Active</span>'
                : '<span class="badge badge-inactive">Inactive</span>'
        },
        {
            headerName: 'Actions', field: 'id', sortable: false, filter: false, minWidth: 220, flex: 0,
            cellRenderer: p => {
                const a = p.data;
                const div = document.createElement('div');
                div.className = 'actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'save';
                editBtn.textContent = 'Edit';
                editBtn.addEventListener('click', () => openEditModal(a));
                div.appendChild(editBtn);

                if (!a.isActive) {
                    const activateBtn = document.createElement('button');
                    activateBtn.className = 'save';
                    activateBtn.textContent = 'Activate';
                    activateBtn.addEventListener('click', () => toggleActive(a.id, true));
                    div.appendChild(activateBtn);
                }

                const actionBtn = document.createElement('button');
                actionBtn.className = 'danger';
                actionBtn.textContent = a.isActive ? 'Deactivate' : 'Delete';
                actionBtn.addEventListener('click', () => deleteAccount(a.id, a.mt5Login, a.isActive));
                div.appendChild(actionBtn);

                return div;
            }
        }
    ];

    document.addEventListener('DOMContentLoaded', () => {
        grid = SLC.createGrid(document.getElementById('dataGrid'), {
            columnDefs,
            rowData: [],
            getRowId: p => String(p.data.id),
            rowStyle: null,
            getRowStyle: p => p.data.isActive ? null : { opacity: 0.5 },
            rowSelection: 'multiple',
            suppressRowClickSelection: true,
            rowMultiSelectWithClick: false,
            onSelectionChanged: refreshBulkBar,
        });
        loadAccounts();
    });

    function refreshBulkBar() {
        const n = grid ? grid.getSelectedRows().length : 0;
        const bar = document.getElementById('bulkBar');
        bar.style.display = n > 0 ? 'flex' : 'none';
        document.getElementById('bulkCount').textContent = `${n} selected`;
    }

    function selectedSurfaces() {
        const out = {};
        if (document.getElementById('bulkSurfEquity').checked) out.excludeFromEquity = null;
        if (document.getElementById('bulkSurfPositions').checked) out.excludeFromPositions = null;
        if (document.getElementById('bulkSurfProfiling').checked) out.excludeFromClientProfiling = null;
        if (document.getElementById('bulkSurfDealMatching').checked) out.excludeFromDealMatching = null;
        if (document.getElementById('bulkSurfSwaps').checked) out.excludeFromSwaps = null;
        return out;
    }

    async function bulkApply(excluded) {
        const ids = grid.getSelectedRows().map(r => r.id);
        if (!ids.length) return;
        const surfaces = selectedSurfaces();
        const surfaceCount = Object.keys(surfaces).length;
        if (!surfaceCount) { msg('Pick at least one surface (Equity/Positions/Profiling/Deal Matching) first', false); return; }
        // Fill in the chosen value for each picked surface; leave others undefined so
        // the backend leaves them untouched.
        const body = { ids };
        for (const k of Object.keys(surfaces)) body[k] = excluded;
        await sendBulk(body, `${excluded ? 'Excluded' : 'Included'} ${ids.length} account(s) for ${surfaceCount} surface(s)`);
    }

    async function bulkSetActive(active) {
        const ids = grid.getSelectedRows().map(r => r.id);
        if (!ids.length) return;
        await sendBulk({ ids, isActive: active }, `${active ? 'Activated' : 'Deactivated'} ${ids.length} account(s)`);
    }

    async function sendBulk(body, okMessage) {
        try {
            const resp = await fetch(API + '/bulk-update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (resp.ok) {
                msg(okMessage, true);
                grid.deselectAll();
                refreshBulkBar();
                loadAccounts();
            } else {
                msg('Error: ' + await resp.text(), false);
            }
        } catch (e) {
            msg('Failed: ' + e.message, false);
        }
    }

    function msg(text, ok) {
        const el = document.getElementById('msg');
        el.textContent = text;
        el.className = ok ? 'msg-ok' : 'msg-err';
        setTimeout(() => el.textContent = '', 4000);
    }

    async function loadAccounts() {
        try {
            const resp = await fetch(API + '?all=true');
            const data = await resp.json();
            document.getElementById('count').textContent = `${data.length} account${data.length !== 1 ? 's' : ''}`;

            if (grid) grid.setGridOption('rowData', data);
        } catch (e) {
            msg('Failed: ' + e.message, false);
        }
    }

    async function addAccount() {
        const login = document.getElementById('loginInput').value.trim();
        const label = document.getElementById('labelInput').value.trim();
        const system = document.getElementById('systemSelect').value;
        const description = document.getElementById('descInput').value.trim() || null;
        // Checkbox labels are "Include in X"; entity stores ExcludeFromX. Invert at the boundary.
        const excludeFromEquity = !document.getElementById('exclEquity').checked;
        const excludeFromPositions = !document.getElementById('exclPositions').checked;
        const excludeFromClientProfiling = !document.getElementById('exclProfiling').checked;
        const excludeFromDealMatching = !document.getElementById('exclDealMatching').checked;
        const excludeFromSwaps = !document.getElementById('exclSwaps').checked;

        if (!login || !label) { msg('Login and Label are required', false); return; }

        try {
            const resp = await fetch(API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mt5Login: parseInt(login), label, system, description, excludeFromEquity, excludeFromPositions, excludeFromClientProfiling, excludeFromDealMatching, excludeFromSwaps })
            });
            if (resp.ok) {
                msg(`Added: ${login} (${label})`, true);
                document.getElementById('loginInput').value = '';
                document.getElementById('labelInput').value = '';
                document.getElementById('descInput').value = '';
                document.getElementById('exclSwaps').checked = true;
                loadAccounts();
            } else {
                msg('Error: ' + await resp.text(), false);
            }
        } catch (e) { msg('Failed: ' + e.message, false); }
    }

    function openEditModal(account) {
        document.getElementById('editId').value = account.id;
        document.getElementById('editLogin').value = account.mt5Login;
        document.getElementById('editLabel').value = account.label;
        document.getElementById('editSystem').value = account.system;
        document.getElementById('editDesc').value = account.description || '';
        document.getElementById('editExclEquity').checked = !account.excludeFromEquity;
        document.getElementById('editExclPositions').checked = !account.excludeFromPositions;
        document.getElementById('editExclProfiling').checked = !account.excludeFromClientProfiling;
        document.getElementById('editExclDealMatching').checked = !account.excludeFromDealMatching;
        document.getElementById('editExclSwaps').checked = !account.excludeFromSwaps;
        document.getElementById('editModal').classList.add('show');
    }

    function closeEditModal() {
        document.getElementById('editModal').classList.remove('show');
    }

    async function saveEdit() {
        const id = document.getElementById('editId').value;
        const login = document.getElementById('editLogin').value.trim();
        const body = {
            mt5Login: login ? parseInt(login) : undefined,
            label: document.getElementById('editLabel').value.trim(),
            system: document.getElementById('editSystem').value,
            description: document.getElementById('editDesc').value.trim() || null,
            excludeFromEquity: !document.getElementById('editExclEquity').checked,
            excludeFromPositions: !document.getElementById('editExclPositions').checked,
            excludeFromClientProfiling: !document.getElementById('editExclProfiling').checked,
            excludeFromDealMatching: !document.getElementById('editExclDealMatching').checked,
            excludeFromSwaps: !document.getElementById('editExclSwaps').checked,
        };

        if (!body.label || !login) { msg('Login and Label are required', false); return; }

        try {
            const resp = await fetch(`${API}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (resp.ok) {
                const updated = await resp.json();
                if (updated.system !== body.system) {
                    msg(`Saved. System auto-corrected to ${updated.system} (found in ${updated.system} manager)`, true);
                } else {
                    msg('Saved', true);
                }
                closeEditModal();
                loadAccounts();
            } else {
                msg('Error: ' + await resp.text(), false);
            }
        } catch (e) { msg('Failed: ' + e.message, false); }
    }

    async function toggleActive(id, val) {
        try {
            const resp = await fetch(`${API}/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ isActive: val })
            });
            if (resp.ok) { msg('Updated', true); loadAccounts(); }
            else msg('Error: ' + await resp.text(), false);
        } catch (e) { msg('Failed: ' + e.message, false); }
    }

    async function deleteAccount(id, login, isActive) {
        const action = isActive ? 'deactivate' : 'permanently delete';
        if (!confirm(`${action} internal account ${login}?`)) return;
        try {
            const resp = await fetch(`${API}/${id}${isActive ? '' : '?permanent=true'}`, { method: 'DELETE' });
            if (resp.ok) { msg(isActive ? 'Deactivated' : 'Deleted', true); loadAccounts(); }
            else msg('Failed', false);
        } catch (e) { msg('Failed: ' + e.message, false); }
    }

    async function resolveSystems() {
        try {
            const resp = await fetch(`${API}/resolve-systems`, { method: 'POST' });
            if (resp.ok) {
                const result = await resp.json();
                if (result.corrected > 0)
                    msg(`Auto-detected: ${result.corrected} of ${result.total} account(s) corrected`, true);
                else
                    msg(`All ${result.total} account(s) already correct`, true);
                loadAccounts();
            } else {
                msg('Error: ' + await resp.text(), false);
            }
        } catch (e) { msg('Failed: ' + e.message, false); }
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Enter' && ['loginInput', 'labelInput', 'descInput'].includes(e.target.id)) addAccount();
        if (e.key === 'Escape') closeEditModal();
    });

    document.getElementById('editModal').addEventListener('click', e => {
        if (e.target === document.getElementById('editModal')) closeEditModal();
    });
</script>
</body>
</html>
