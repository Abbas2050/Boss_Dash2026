<!DOCTYPE html>
<html>
<head>
    <title>SLC - Client Account Monitor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { padding: 0; }
        .page { max-width: 1500px; margin: 0 auto; padding: 20px; }
        h1 { color: var(--blue); margin-bottom: 6px; }
        .subtitle { color: var(--fg-muted); font-size: 13px; margin-bottom: 8px; }

        .status-bar { display: flex; gap: 15px; margin-bottom: 8px; font-size: 12px; align-items: center; }
        .ws-status { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .ws-connected { background: #1a3a2a; color: var(--pos); }
        .ws-disconnected { background: #3a1a1a; color: var(--rose); }
        .ws-reconnecting { background: #3a2a1a; color: var(--amber); }

        .last-tick { padding: 4px 10px; border-radius: 4px; background: #1a3a2a; color: var(--pos); font-size: 12px; }
        .last-tick.stale { background: #3a1a1a; color: var(--rose); }
        .alert-count { font-size: 12px; color: var(--fg-muted); margin-left: auto; }

        .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin-bottom: 8px; }
        h2 { color: var(--pos); margin-bottom: 8px; font-size: 14px; }

        .form-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
        .form-inline input { background: var(--bg3); border: 1px solid var(--line); color: var(--fg); padding: 4px 8px; border-radius: 4px; font-size: 13px; }
        .form-inline input[type="number"] { width: 130px; }
        .form-inline input[name="loginInput"] { width: 130px; }
        .form-inline input[name="nameInput"] { width: 160px; }
        .form-inline input[name="notesInput"] { width: 200px; }
        .form-inline .hint { font-size: 11px; color: var(--fg-muted); }
        .form-inline .save-msg { font-size: 12px; }
        .save-msg.ok { color: var(--pos); }
        .save-msg.err { color: var(--rose); }

        button { background: var(--blue); color: var(--surface); border: none; padding: 6px 14px; cursor: pointer; border-radius: 4px; font-size: 13px; font-weight: bold; }
        button:hover { background: #89b4fa; }
        button.danger { background: var(--rose); color: var(--surface); }
        button.danger:hover { background: #ff9e9e; }

        .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: bold; display: inline-block; margin-right: 4px; }
        .badge-margin { background: #3b2e1a; color: var(--amber); }
        .badge-equity { background: #3a1a1a; color: var(--rose); }

        #rosterGrid { height: 340px; width: 100%; }
        #alertGrid { height: 420px; width: 100%; }
        #rosterGrid .ag-cell, #alertGrid .ag-cell { display: flex; align-items: center; }
    </style>
    <link rel="stylesheet" href="/shared/theme.css">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community@31.3.2/dist/ag-grid-community.min.js"></script>
    <script src="/shared/grid.js"></script>
    <script src="/shared/nav.js"></script>
</head>
<body>
<div class="page">
    <h1>Client Account Monitor</h1>
    <p class="subtitle">Per-client margin level / equity thresholds. Alerts fire when the live value falls at or below the configured threshold. Poll interval is server-configured.</p>

    <div class="status-bar">
        <span class="ws-status ws-disconnected" id="wsStatus">Disconnected</span>
        <span class="last-tick stale" id="lastTick">Waiting for first tick...</span>
        <span class="alert-count" id="alertCount">0 active alerts</span>
    </div>

    <!-- Monitored Accounts -->
    <div class="panel">
        <h2>Monitored Accounts</h2>
        <div class="form-inline">
            <input type="number" name="loginInput" id="loginInput" placeholder="Login" min="1" step="1">
            <input type="text" name="nameInput" id="nameInput" placeholder="Name (optional)">
            <input type="number" name="marginInput" id="marginInput" placeholder="MarginLevel <=" min="0.01" max="10000" step="0.1">
            <span class="hint">%</span>
            <input type="number" name="equityInput" id="equityInput" placeholder="Equity <=" step="0.01">
            <input type="text" name="notesInput" id="notesInput" placeholder="Notes (optional)">
            <button onclick="addRow()">Save</button>
            <span class="save-msg" id="addMsg"></span>
        </div>
        <div id="rosterGrid" class="ag-theme-alpine-dark"></div>
    </div>

    <!-- Currently Firing -->
    <div class="panel">
        <h2>Currently Firing</h2>
        <div id="alertGrid" class="ag-theme-alpine-dark"></div>
    </div>
</div>

<script>
    let rosterGridApi = null;
    let alertGridApi = null;
    let lastTickAt = null;
    const STALE_MS = 90 * 1000;

    const fmtNum = (v, dp = 2) => (v == null || isNaN(v)) ? '' : Number(v).toFixed(dp);
    const fmtTime = v => {
        if (!v) return '';
        const d = new Date(v);
        return isNaN(d.getTime()) ? '' : d.toLocaleString();
    };

    function firedBadges(p) {
        let html = '';
        if (p.data.marginFired) html += '<span class="badge badge-margin">Margin</span>';
        if (p.data.equityFired) html += '<span class="badge badge-equity">Equity</span>';
        return html;
    }

    const rosterCols = [
        { headerName: 'Login', field: 'login', maxWidth: 130, editable: false, cellStyle: { fontWeight: 'bold' } },
        { headerName: 'Name', field: 'name', minWidth: 150, editable: true, cellEditor: 'agTextCellEditor' },
        {
            headerName: 'MarginLevel <= (%)', field: 'marginLevelThreshold', maxWidth: 160,
            editable: true, cellEditor: 'agNumberCellEditor',
            cellEditorParams: { min: 0.01, max: 10000, precision: 2 },
            valueFormatter: p => p.value == null ? '' : fmtNum(p.value, 2),
        },
        {
            headerName: 'Equity <=', field: 'equityThreshold', maxWidth: 150,
            editable: true, cellEditor: 'agNumberCellEditor',
            cellEditorParams: { precision: 2 },
            valueFormatter: p => p.value == null ? '' : fmtNum(p.value, 2),
        },
        { headerName: 'Notes', field: 'notes', minWidth: 180, editable: true, cellEditor: 'agTextCellEditor' },
        { headerName: 'Updated', field: 'updatedUtc', maxWidth: 170, editable: false, valueFormatter: p => fmtTime(p.value) },
        {
            headerName: '', colId: 'actions', maxWidth: 90, editable: false, sortable: false, filter: false,
            cellRenderer: p => {
                const btn = document.createElement('button');
                btn.className = 'danger';
                btn.textContent = 'Delete';
                btn.style.padding = '3px 10px';
                btn.style.fontSize = '11px';
                btn.addEventListener('click', () => deleteRow(p.data.login));
                return btn;
            },
        },
    ];

    document.addEventListener('DOMContentLoaded', () => {
        rosterGridApi = SLC.createGrid(document.getElementById('rosterGrid'), {
            columnDefs: rosterCols,
            rowData: [],
            getRowId: p => String(p.data.login),
            overlayNoRowsTemplate: 'No monitored accounts. Add one above.',
            onCellValueChanged: onRosterCellChanged,
        });

        alertGridApi = SLC.createGrid(document.getElementById('alertGrid'), {
            columnDefs: alertCols,
            rowData: [],
            getRowId: p => String(p.data.login),
            overlayNoRowsTemplate: 'No accounts currently breaching a threshold.',
        });

        loadRoster();
        startConnection();
    });

    setInterval(refreshLastTickLabel, 1000);

    async function extractError(r) {
        const text = await r.text().catch(() => '');
        if (text) {
            try {
                const j = JSON.parse(text);
                if (j && typeof j.error === 'string' && j.error) return j.error;
            } catch (_) { /* fall through */ }
        }
        return 'HTTP ' + r.status + (text ? ': ' + text : '');
    }

    async function loadRoster() {
        try {
            const resp = await fetch('/api/ClientAccountMonitor');
            if (!resp.ok) throw new Error(await extractError(resp));
            const rows = await resp.json();
            SLC.applyDiff(rosterGridApi, rows, d => String(d.login));
        } catch (e) {
            console.error('Failed to load roster:', e);
        }
    }

    function showAddMsg(text, ok) {
        const msg = document.getElementById('addMsg');
        msg.className = 'save-msg ' + (ok ? 'ok' : 'err');
        msg.textContent = text;
        if (ok) setTimeout(() => { msg.textContent = ''; }, 2500);
    }

    async function addRow() {
        const login = parseInt(document.getElementById('loginInput').value, 10);
        const name = document.getElementById('nameInput').value.trim();
        const marginRaw = document.getElementById('marginInput').value;
        const equityRaw = document.getElementById('equityInput').value;
        const notes = document.getElementById('notesInput').value.trim();

        if (!Number.isInteger(login) || login <= 0) {
            showAddMsg('Login must be a positive integer', false);
            return;
        }
        const marginLevelThreshold = marginRaw === '' ? null : parseFloat(marginRaw);
        const equityThreshold = equityRaw === '' ? null : parseFloat(equityRaw);
        if (marginLevelThreshold == null && equityThreshold == null) {
            showAddMsg('At least one threshold (MarginLevel or Equity) is required', false);
            return;
        }

        const body = {
            login: login,
            name: name || null,
            marginLevelThreshold: marginLevelThreshold,
            equityThreshold: equityThreshold,
            notes: notes || null,
        };
        try {
            const resp = await fetch('/api/ClientAccountMonitor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!resp.ok) throw new Error(await extractError(resp));
            showAddMsg('Saved', true);
            document.getElementById('loginInput').value = '';
            document.getElementById('nameInput').value = '';
            document.getElementById('marginInput').value = '';
            document.getElementById('equityInput').value = '';
            document.getElementById('notesInput').value = '';
            await loadRoster();
        } catch (e) {
            showAddMsg('Failed: ' + e.message, false);
        }
    }

    async function onRosterCellChanged(ev) {
        const field = ev.colDef.field;
        if (!['name', 'marginLevelThreshold', 'equityThreshold', 'notes'].includes(field)) return;

        const row = ev.data;
        if (row.marginLevelThreshold == null && row.equityThreshold == null) {
            // Revert -- at least one threshold must remain set.
            row[field] = ev.oldValue;
            ev.api.refreshCells({ rowNodes: [ev.node], columns: [field], force: true });
            SLC._toast && SLC._toast('At least one threshold must be set');
            return;
        }

        const body = {
            login: row.login,
            name: row.name || null,
            marginLevelThreshold: row.marginLevelThreshold,
            equityThreshold: row.equityThreshold,
            notes: row.notes || null,
        };
        try {
            const resp = await fetch('/api/ClientAccountMonitor/' + row.login, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body),
            });
            if (!resp.ok) throw new Error(await extractError(resp));
            await loadRoster();
        } catch (e) {
            console.error('Failed to save edit:', e);
            row[field] = ev.oldValue;
            ev.api.refreshCells({ rowNodes: [ev.node], columns: [field], force: true });
        }
    }

    async function deleteRow(login) {
        if (!confirm('Remove login ' + login + ' from the monitor?')) return;
        try {
            const resp = await fetch('/api/ClientAccountMonitor/' + login, { method: 'DELETE' });
            if (resp.status !== 204) throw new Error(await extractError(resp));
            await loadRoster();
        } catch (e) {
            console.error('Failed to delete row:', e);
        }
    }

    const alertCols = [
        { headerName: 'Login', field: 'login', maxWidth: 120, cellStyle: { fontWeight: 'bold' } },
        { headerName: 'Name', field: 'name', minWidth: 140 },
        { headerName: 'Fired', colId: 'fired', maxWidth: 140, sortable: false, filter: false, cellRenderer: firedBadges },
        { headerName: 'MarginLevel %', field: 'marginLevel', maxWidth: 130, valueFormatter: p => fmtNum(p.value, 2) },
        { headerName: 'Equity', field: 'equity', maxWidth: 130, valueFormatter: p => fmtNum(p.value) },
        { headerName: 'Balance', field: 'balance', maxWidth: 130, valueFormatter: p => fmtNum(p.value) },
        { headerName: 'Margin', field: 'margin', maxWidth: 130, valueFormatter: p => fmtNum(p.value) },
        { headerName: 'Free Margin', field: 'freeMargin', maxWidth: 130, valueFormatter: p => fmtNum(p.value) },
        { headerName: 'MarginLevel <=', field: 'marginLevelThreshold', maxWidth: 130, valueFormatter: p => p.value == null ? '' : fmtNum(p.value, 2) },
        { headerName: 'Equity <=', field: 'equityThreshold', maxWidth: 120, valueFormatter: p => p.value == null ? '' : fmtNum(p.value) },
        { headerName: 'Last Update', field: 'timestampUtc', maxWidth: 170, valueFormatter: p => fmtTime(p.value) },
    ];

    function onAlerts(alerts) {
        const rows = Array.isArray(alerts) ? alerts : [];
        document.getElementById('alertCount').textContent =
            `${rows.length} active alert${rows.length !== 1 ? 's' : ''}`;
        if (alertGridApi) SLC.applyDiff(alertGridApi, rows, d => String(d.login));
        // Heartbeat -- an empty payload still counts as a tick.
        lastTickAt = Date.now();
        refreshLastTickLabel();
    }

    function refreshLastTickLabel() {
        const el = document.getElementById('lastTick');
        if (lastTickAt == null) {
            el.className = 'last-tick stale';
            el.textContent = 'Waiting for first tick...';
            return;
        }
        const ageMs = Date.now() - lastTickAt;
        const ageSec = Math.floor(ageMs / 1000);
        const stale = ageMs > STALE_MS;
        el.className = stale ? 'last-tick stale' : 'last-tick';
        el.textContent = stale
            ? `Stale - no tick for ${ageSec}s`
            : `Last tick: ${ageSec}s ago`;
    }

    const connection = new signalR.HubConnectionBuilder()
        .withUrl('/ws/dashboard')
        .withAutomaticReconnect([0, 1000, 2000, 5000, 10000])
        .build();

    connection.on('ClientAccountAlerts', onAlerts);

    function setWs(state) {
        const el = document.getElementById('wsStatus');
        if (state === 'connected') {
            el.className = 'ws-status ws-connected';
            el.textContent = 'Connected';
        } else if (state === 'reconnecting') {
            el.className = 'ws-status ws-reconnecting';
            el.textContent = 'Reconnecting...';
        } else {
            el.className = 'ws-status ws-disconnected';
            el.textContent = 'Disconnected';
        }
    }

    connection.onclose(() => setWs('disconnected'));
    connection.onreconnecting(() => setWs('reconnecting'));
    connection.onreconnected(() => setWs('connected'));

    async function startConnection() {
        try {
            await connection.start();
            setWs('connected');
        } catch (e) {
            console.error('SignalR error:', e);
            setWs('disconnected');
            setTimeout(startConnection, 3000);
        }
    }
</script>
</body>
</html>
